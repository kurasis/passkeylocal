name: Windows desktop
on:
  pull_request:
    paths-ignore: ['docs/**', 'deploy/**', 'README.md']
  push:
    branches: [main]
    paths-ignore: ['docs/**', 'deploy/**', 'README.md']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: windows-${{ github.ref }}
  cancel-in-progress: true
jobs:
  windows:
    name: Windows x64 checks and unsigned offline installer
    runs-on: windows-2025
    timeout-minutes: 60
    env:
      CARGO_TERM_COLOR: always
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Restore native check cache (no privileged signing/release job)
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            apps/desktop/src-tauri/target
          key: windows-native-1.90-${{ hashFiles('apps/desktop/src-tauri/Cargo.lock') }}-${{ github.sha }}
          restore-keys: |
            windows-native-1.90-${{ hashFiles('apps/desktop/src-tauri/Cargo.lock') }}-
            windows-native-1.90-
      - name: Pinned toolchain and dependencies
        shell: pwsh
        run: |
          rustup show
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm ci
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m pip install --require-hashes -r tools/vault-recovery/requirements.lock -r tools/vault-recovery/requirements-dev.lock
      - run: npm run typecheck
      - run: npm test
      - run: cargo fmt --manifest-path apps/desktop/src-tauri/Cargo.toml --check
      - run: cargo clippy --locked --manifest-path apps/desktop/src-tauri/Cargo.toml --all-targets -- -D warnings
      - name: Native storage, actual Windows replacement and fail-closed Hello tests
        run: cargo test --locked --manifest-path apps/desktop/src-tauri/Cargo.toml
      - name: Shared engine and native file service full Python parity
        shell: pwsh
        run: |
          cargo build --locked --manifest-path apps/desktop/src-tauri/Cargo.toml --example storage_fixture_driver
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $env:RECOVERY_PYTHON = "python"
          node apps/desktop/test/interop.ts
      - name: Build both independent frontend outputs and check target isolation
        run: |
          npm run build -w @passkey-local/pwa
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm run desktop:frontend
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node apps/desktop/scripts/check-bundles.mjs
      - name: Independent recovery corpus
        run: python -m pytest -q -p no:cacheprovider tools/vault-recovery/tests tests/interop tests/security
      - name: Save native compilation cache (tests still gate packaging)
        if: success() || failure()
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            apps/desktop/src-tauri/target
          key: windows-native-1.90-${{ hashFiles('apps/desktop/src-tauri/Cargo.lock') }}-${{ github.sha }}
      - name: Build Windows per-user NSIS installer with offline WebView2 runtime
        run: npm run desktop:build
      - name: Packaged application process and main-window smoke
        shell: pwsh
        run: node apps/desktop/scripts/packaged-smoke.mjs
      - name: Package checksums and build metadata (unsigned, hardware unverified)
        shell: pwsh
        run: apps/desktop/scripts/package-artifacts.ps1
      - name: Save installer compilation cache (packaging remains gated by tests)
        if: success() || failure()
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            apps/desktop/src-tauri/target
          key: windows-native-1.90-${{ hashFiles('apps/desktop/src-tauri/Cargo.lock') }}-${{ github.sha }}-bundle
      - name: Upload synthetic smoke diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: Windows-smoke-diagnostics-${{ github.sha }}
          path: apps/desktop/artifacts/smoke-failure.*
          if-no-files-found: ignore
          retention-days: 7
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: PassKey-Local-Windows-x64-${{ github.sha }}-unsigned
          path: apps/desktop/artifacts/
          if-no-files-found: error
          retention-days: 30
