name: Publish versioned desktop release
on:
  workflow_dispatch:
    inputs:
      version:
        description: Application version already merged to main
        required: true
        default: '0.1.1'
      windows_run_id:
        description: Successful Windows workflow run for code included in main
        required: true
permissions:
  contents: read
concurrency:
  group: desktop-release-${{ inputs.version }}
  cancel-in-progress: false
jobs:
  prepare:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    outputs:
      manifest_sha: ${{ steps.prepare.outputs.manifest_sha }}
      target_sha: ${{ steps.prepare.outputs.target_sha }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
      - name: Verify tested source, installer and version; prepare archives
        id: prepare
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ inputs.version }}
          WINDOWS_RUN_ID: ${{ inputs.windows_run_id }}
        run: python .github/scripts/desktop-release.py prepare
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: release-payload-${{ inputs.version }}
          path: release-output/
          if-no-files-found: error
          retention-days: 7
  publish:
    needs: prepare
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ needs.prepare.outputs.target_sha }}
          persist-credentials: false
      - name: Download immutable payload from this workflow
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ inputs.version }}
        run: gh run download "$GITHUB_RUN_ID" --repo "$GITHUB_REPOSITORY" --name "release-payload-$RELEASE_VERSION" --dir release-output
      - name: Verify payload and publish versioned release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ inputs.version }}
          MANIFEST_SHA: ${{ needs.prepare.outputs.manifest_sha }}
          TARGET_SHA: ${{ needs.prepare.outputs.target_sha }}
        run: python .github/scripts/desktop-release.py publish
