name: Cloudflare deployed icon check
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24
      - name: Check public shell and icon endpoint without vault data
        id: probe
        run: node .github/scripts/check-cloudflare.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cloudflare-check-${{ steps.probe.outputs.version }}-${{ github.run_id }}
          path: cloudflare-check-*.json
          if-no-files-found: error
