[package]
name = "passkey-text-preview"
version = "0.1.0"
edition = "2021"
rust-version = "1.90"
license = "GPL-3.0-only"

[dependencies]
zeroize = "=1.9.0"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "=0.61.2", features = ["Win32_Foundation", "Win32_Security", "Win32_Security_Authorization", "Win32_Security_Isolation", "Win32_System_Threading", "Win32_System_Memory", "Win32_System_JobObjects", "Win32_System_SystemInformation", "Win32_Storage_FileSystem", "Win32_System_Registry", "Win32_Networking_WinSock", "Win32_System_DataExchange", "Win32_System_LibraryLoader"] }

[features]
proof = []

[[bin]]
name = "passkey-text-worker"
path = "src/bin/worker.rs"

[[bin]]
name = "passkey-preview-probe"
path = "src/bin/probe.rs"
required-features = ["proof"]

[profile.release]
strip = true
